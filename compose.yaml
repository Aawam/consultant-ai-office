services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-consultant_ai_office}
      POSTGRES_USER: ${POSTGRES_USER:-consultant_ai_office}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-consultant_ai_office_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-consultant_ai_office} -d ${POSTGRES_DB:-consultant_ai_office}
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - consultant_ai_office_postgres:/var/lib/postgresql/data

volumes:
  consultant_ai_office_postgres:
